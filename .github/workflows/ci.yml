
name: CloudLaunch CI Pipeline

# Run the pipeline whenever code is pushed or a pull request is created
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd app/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend imports
        run: |
          cd app/backend
          python -c "from main import app; print('Backend application loaded successfully')"

  frontend-check:
    name: Frontend Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd app/frontend
          npm ci

      - name: Build React application
        run: |
          cd app/frontend
          npm run build

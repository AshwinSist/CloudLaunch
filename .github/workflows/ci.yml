
name: CloudLaunch CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd app/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Check backend imports
        run: |
          cd app/backend
          python -c "from main import app; print('Backend application loaded successfully')"

      - name: Run backend tests
        run: |
          cd app/backend
          python -m pytest -v

  frontend-check:
    name: Frontend Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd app/frontend
          npm ci

      - name: Build React application
        run: |
          cd app/frontend
          npm run build

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

  docker-build:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
      - security-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Convert GitHub owner to lowercase
        id: owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:${{ github.sha }}

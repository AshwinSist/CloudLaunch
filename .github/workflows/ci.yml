
name: CloudLaunch CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd app/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Check backend imports
        run: |
          cd app/backend
          python -c "from main import app; print('Backend application loaded successfully')"

      - name: Run backend tests
        run: |
          cd app/backend
          python -m pytest -v

  frontend-check:
    name: Frontend Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd app/frontend
          npm ci

      - name: Build React application
        run: |
          cd app/frontend
          npm run build

  security-scan:
    name: Trivy Source Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Scan source code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  docker-build:
    name: Build, Scan and Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
      - security-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Convert GitHub owner to lowercase
        id: owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:latest \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:${{ github.sha }} \
            ./app/backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:latest \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:${{ github.sha }} \
            ./app/frontend

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:latest
          scanners: vuln,secret
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:latest
          scanners: vuln,secret
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend Docker image
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-backend:${{ github.sha }}

      - name: Publish frontend Docker image
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/cloudlaunch-frontend:${{ github.sha }}

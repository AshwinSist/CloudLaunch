
server {
    listen 80;

    server_name localhost;

    # Serve the React frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the new GHCR backend container
    location /api/ {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward health checks
    location /health {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/health;
    }

    # Forward version requests
    location /version {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/version;
    }
}


server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to FastAPI
    location /api/ {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward backend health checks
    location = /health {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/health;
    }

    # Forward backend version requests
    location = /version {
        proxy_pass http://cloudlaunch-ghcr-backend:8000/version;
    }
}
